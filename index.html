<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Selection Matrix</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 95%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            color: #003366;
            margin-bottom: 20px;
        }

        img {
            width: 100%;
            height: auto;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        p {
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Goal Selection Matrix</h1>

    <img src="goal-selection-matrix.png" alt="Goal Selection Matrix">

    <p>
        This page displays the Goal Selection Matrix for reference.
    </p>
</div>

</body>
</html>
